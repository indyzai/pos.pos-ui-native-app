services:
  openpos-cloud:
    # Root is used only by the image entrypoint to copy an owner-only bind
    # mount into a bun-owned runtime file; Cloud itself then runs as bun.
    user: "0:0"
    environment:
      OPEN_POS_CLOUD_AUTH_TOKENS_FILE: /run/secrets/openpos_cloud_tokens
    secrets:
      - source: openpos_cloud_tokens
        target: openpos_cloud_tokens

secrets:
  openpos_cloud_tokens:
    file: ${OPEN_POS_CLOUD_AUTH_TOKENS_FILE_HOST:?OPEN_POS_CLOUD_AUTH_TOKENS_FILE_HOST must name the host token file}
