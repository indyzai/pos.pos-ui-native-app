name: Admin Mobile Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - "v*"
      - "admin-v*"
    paths:
      - ".github/workflows/admin-mobile-release.yml"
      - "apps/admin-mobile/**"
      - "packages/**"
      - "package.json"
      - "bun.lock"
      - ".bun-version"

permissions:
  contents: write

concurrency:
  group: admin-mobile-release-${{ github.ref }}
  cancel-in-progress: false

env:
  EXPO_NO_TELEMETRY: "1"
  NODE_OPTIONS: --max-old-space-size=6144

jobs:
  metadata:
    name: Resolve release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      release_name: ${{ steps.release.outputs.release_name }}
    steps:
      - uses: actions/checkout@v4

      - id: release
        name: Resolve version and release type
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#admin-v}"
            VERSION="${VERSION#v}"
            TAG="$GITHUB_REF_NAME"
            PRERELEASE=false
            RELEASE_NAME="IndyzAI POS Admin ${VERSION}"
          else
            BASE="$(jq -r '.expo.version' apps/admin-mobile/app.json | sed -E 's/-alpha\..*$//')"
            VERSION="${BASE}-alpha.${GITHUB_RUN_NUMBER}"
            TAG="admin-v${VERSION}"
            PRERELEASE=true
            RELEASE_NAME="IndyzAI POS Admin ${VERSION}"
          fi
          {
            echo "version=$VERSION"
            echo "tag=$TAG"
            echo "prerelease=$PRERELEASE"
            echo "release_name=$RELEASE_NAME"
          } >> "$GITHUB_OUTPUT"

  validate:
    name: Validate release source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Check, compile, and test
        working-directory: apps/admin-mobile
        run: |
          bun run format:check
          bunx tsc --noEmit
          bun test tests

  android:
    name: Android APK and AAB
    needs: [metadata, validate]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HAS_UPLOAD_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Set application version
        working-directory: apps/admin-mobile
        env:
          APP_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          jq --arg version "$APP_VERSION" --arg build "$GITHUB_RUN_NUMBER" \
            --argjson code "$GITHUB_RUN_NUMBER" \
            '.expo.version = $version | .expo.android.versionCode = $code | .expo.ios.buildNumber = $build' \
            app.json > app.next.json
          mv app.next.json app.json

      - name: Generate Android project
        working-directory: apps/admin-mobile
        run: bunx expo prebuild --clean --platform android --non-interactive --no-install

      - name: Configure optional release signing
        if: env.HAS_UPLOAD_KEY == 'true'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          KEYSTORE_PATH="$GITHUB_WORKSPACE/apps/admin-mobile/android/app/upload-keystore.jks"
          echo "$KEYSTORE" | base64 --decode > "$KEYSTORE_PATH"
          echo "SIGNING_FLAGS=-Pandroid.injected.signing.store.file=$KEYSTORE_PATH -Pandroid.injected.signing.store.password=$STORE_PASSWORD -Pandroid.injected.signing.key.alias=$KEY_ALIAS -Pandroid.injected.signing.key.password=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release packages
        working-directory: apps/admin-mobile/android
        run: ./gradlew app:assembleRelease app:bundleRelease --build-cache $SIGNING_FLAGS

      - name: Collect Android artifacts
        working-directory: apps/admin-mobile
        env:
          APP_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          mkdir -p release
          cp "$(find android/app/build/outputs/apk/release -name '*.apk' -print -quit)" \
            "release/indyz-pos-admin-${APP_VERSION}.apk"
          cp "$(find android/app/build/outputs/bundle/release -name '*.aab' -print -quit)" \
            "release/indyz-pos-admin-${APP_VERSION}.aab"

      - uses: actions/upload-artifact@v4
        with:
          name: admin-android-${{ needs.metadata.outputs.version }}
          path: apps/admin-mobile/release/*
          if-no-files-found: error

  ios:
    name: iOS Simulator App
    needs: [metadata, validate]
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Set application version
        working-directory: apps/admin-mobile
        env:
          APP_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          jq --arg version "$APP_VERSION" --arg build "$GITHUB_RUN_NUMBER" \
            --argjson code "$GITHUB_RUN_NUMBER" \
            '.expo.version = $version | .expo.ios.buildNumber = $build | .expo.android.versionCode = $code' \
            app.json > app.next.json
          mv app.next.json app.json

      - name: Generate iOS project
        working-directory: apps/admin-mobile
        run: bunx expo prebuild --clean --platform ios --non-interactive --no-install

      - name: Install CocoaPods dependencies
        working-directory: apps/admin-mobile/ios
        run: pod install

      - name: Build simulator app
        working-directory: apps/admin-mobile
        run: |
          set -euo pipefail
          WORKSPACE="$(find ios -maxdepth 1 -name '*.xcworkspace' -type d -print -quit)"
          PROJECT="$(find ios -maxdepth 1 -name '*.xcodeproj' -type d -print -quit)"
          PROJECT_NAME="$(basename "$PROJECT" .xcodeproj)"
          xcodebuild -list -json -project "$PROJECT" > "$RUNNER_TEMP/project.json"
          SCHEME="$(ruby -rjson -e 'p=ARGV[0]; s=JSON.parse(STDIN.read).dig("project","schemes")||[]; puts(s.find{|x|x==p}||s.first)' "$PROJECT_NAME" < "$RUNNER_TEMP/project.json")"
          xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Debug \
            -sdk iphonesimulator -derivedDataPath "$RUNNER_TEMP/derived-data" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build

      - name: Package iOS artifact
        env:
          APP_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          APP="$(find "$RUNNER_TEMP/derived-data/Build/Products" -name '*.app' -type d -print -quit)"
          test -n "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" \
            "$RUNNER_TEMP/indyz-pos-admin-${APP_VERSION}-ios-simulator.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: admin-ios-${{ needs.metadata.outputs.version }}
          path: ${{ runner.temp }}/indyz-pos-admin-${{ needs.metadata.outputs.version }}-ios-simulator.zip
          if-no-files-found: error

  github-release:
    name: Publish GitHub Release
    needs: [metadata, android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: admin-*
          path: release-assets
          merge-multiple: true

      - name: Publish all build artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.metadata.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.metadata.outputs.release_name }}
          prerelease: ${{ needs.metadata.outputs.prerelease }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/*
