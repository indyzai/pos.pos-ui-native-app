name: Android Release Build

on:
  workflow_dispatch:
    inputs:
      archs:
        description: Comma-separated Android ABIs to build
        required: true
        default: arm64-v8a,armeabi-v7a
        type: string
      retention_days:
        description: Artifact retention in days
        required: true
        default: "14"
        type: string
      play_track:
        description: Google Play track (internal, alpha, beta, production)
        required: false
        default: internal
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
      publish_to_play:
        description: Publish AAB to Google Play Store
        required: false
        default: true
        type: boolean
  push:
    branches: [main, master]
    tags:
      - 'v*'
    paths:
      - ".github/workflows/android-release-build.yml"
      - "apps/mobile/**"
      - "package.json"
      - "bun.lock"
      - ".bun-version"

permissions:
  contents: read

env:
  EXPO_NO_TELEMETRY: "1"
  NODE_OPTIONS: --max-old-space-size=6144

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-release:
    name: Android Release APK + AAB
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Expose secret presence as a plain env var — secrets context is not
      # available in step `if:` expressions, but env context is.
      # Use a dedicated UPLOAD key — NOT the app signing key managed by Google Play.
      # See: https://developer.android.com/studio/publish/app-signing#generate-key
      HAS_UPLOAD_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      HAS_PLAY_STORE_KEY: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON != '' || secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON != '' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-ccache-${{ github.ref }}
          restore-keys: |
            ${{ runner.os }}-ccache-main
            ${{ runner.os }}-ccache-
          max-size: 2G
          create-symlink: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Set app version
        working-directory: apps/mobile
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            # Tag build: use the tag itself (strip leading 'v').
            VERSION="${GITHUB_REF_NAME#v}"
          else
            # Main branch alpha build.
            # 1. Try to resolve base version from the latest published GitHub Release.
            LATEST_TAG=$(curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/releases/latest" \
              2>/dev/null | jq -r '.tag_name // empty' || true)

            if [[ -n "$LATEST_TAG" ]]; then
              BASE="${LATEST_TAG#v}"
              echo "Base version from latest release: $BASE"
            else
              # No release yet — fall back to app.json (strip any previous alpha suffix).
              BASE="$(jq -r '.expo.version' app.json | sed 's/\.[0-9]*$//; s/\.[0-9]*-alpha$//; s/-alpha\..*//')"
              echo "No release found, base version from app.json: $BASE"
            fi

            VERSION="${BASE}.${GITHUB_RUN_NUMBER}"
          fi

          BUILD_NUMBER="$GITHUB_RUN_NUMBER"
          echo "App version  : $VERSION"
          echo "Build number : $BUILD_NUMBER"

          jq \
            --arg v  "$VERSION" \
            --arg bn "$BUILD_NUMBER" \
            --argjson vc "$GITHUB_RUN_NUMBER" \
            '.expo.version = $v | .expo.android.versionCode = $vc | .expo.ios.buildNumber = $bn' \
            app.json > _app.json && mv _app.json app.json

          echo "Updated app.json:"
          jq '{version: .expo.version, versionCode: .expo.android.versionCode}' app.json
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Generate Android project
        working-directory: apps/mobile
        run: |
          bunx expo prebuild --clean --platform android --non-interactive --no-install
          # Tune Gradle settings for CI runner (allocate 6GB heap, enable build caching & parallel execution)
          python3 -c "
          with open('android/gradle.properties', 'r') as f:
              content = f.read()
          content = content.replace('-Xmx2048m -XX:MaxMetaspaceSize=512m', '-Xmx6144m -XX:MaxMetaspaceSize=1024m -XX:+UseG1GC -XX:+ParallelRefProcEnabled')
          if 'org.gradle.caching=true' not in content:
              content += '\norg.gradle.caching=true\norg.gradle.parallel=true\norg.gradle.vfs.watch=false\n'
          with open('android/gradle.properties', 'w') as f:
              f.write(content)
          "

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      # ─────────────────────────────────────────────────────────────────────────
      # Upload key signing
      #
      # Requires these repository secrets (Settings → Secrets → Actions):
      #   ANDROID_UPLOAD_KEYSTORE_BASE64  — base64 of your upload .jks/.keystore
      #   ANDROID_UPLOAD_STORE_PASSWORD   — keystore store password
      #   ANDROID_UPLOAD_KEY_ALIAS        — key alias inside the keystore
      #   ANDROID_UPLOAD_KEY_PASSWORD     — key password
      #
      # IMPORTANT: this must be a SEPARATE key from the app signing key that
      # Google Play manages. To generate one:
      #   keytool -genkeypair -v \
      #     -keystore upload-key.jks -alias upload \
      #     -keyalg RSA -keysize 2048 -validity 10000
      # Then register it in Play Console → Setup → App signing → Upload key.
      # ─────────────────────────────────────────────────────────────────────────
      - name: Prepare upload key
        if: env.HAS_UPLOAD_KEY == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS:         ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD:      ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          KEYSTORE_PATH="$GITHUB_WORKSPACE/apps/mobile/android/app/upload-keystore.jks"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          # Export as Gradle -P signing flags consumed by the build step.
          {
            echo "SIGNING_FLAGS=-Pandroid.injected.signing.store.file=$KEYSTORE_PATH"
            echo " -Pandroid.injected.signing.store.password=$ANDROID_KEYSTORE_PASSWORD"
            echo " -Pandroid.injected.signing.key.alias=$ANDROID_KEY_ALIAS"
            echo " -Pandroid.injected.signing.key.password=$ANDROID_KEY_PASSWORD"
          } | tr -d '\n' >> "$GITHUB_ENV"
          echo "" >> "$GITHUB_ENV"

      - name: Build release APK and AAB
        working-directory: apps/mobile/android
        env:
          ARCHS: ${{ inputs.archs || 'arm64-v8a,armeabi-v7a' }}
          CCACHE_DIR: ${{ runner.temp }}/.ccache
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          GRADLE_OPTS: >-
            -Dorg.gradle.jvmargs="-Xmx6144m -XX:MaxMetaspaceSize=1024m -XX:+UseG1GC -XX:+ParallelRefProcEnabled"
            -Dorg.gradle.parallel=true
            -Dorg.gradle.caching=true
            -Dorg.gradle.vfs.watch=false
        run: |
          # assembleRelease / bundleRelease → non-debuggable, release-signed.
          # SIGNING_FLAGS is empty when HAS_UPLOAD_KEY is false (unsigned release).
          ./gradlew app:assembleRelease app:bundleRelease \
            --build-cache \
            --parallel \
            -PreactNativeArchitectures="$ARCHS" \
            $SIGNING_FLAGS

      - name: Rename release artifacts
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          APK=$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)
          AAB=$(find android/app/build/outputs/bundle/release -name '*.aab' | head -1)
          mkdir -p dist
          cp "$APK" "dist/indyz-pos-${APP_VERSION}.apk"
          cp "$AAB" "dist/indyz-pos-${APP_VERSION}.aab"
          echo "APK: dist/indyz-pos-${APP_VERSION}.apk ($(du -sh "dist/indyz-pos-${APP_VERSION}.apk" | cut -f1))"
          echo "AAB: dist/indyz-pos-${APP_VERSION}.aab ($(du -sh "dist/indyz-pos-${APP_VERSION}.aab" | cut -f1))"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: indyz-pos-android-release-apk-${{ env.APP_VERSION }}-${{ github.sha }}
          path: apps/mobile/dist/indyz-pos-${{ env.APP_VERSION }}.apk
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days || 14 }}

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: indyz-pos-android-release-aab-${{ env.APP_VERSION }}-${{ github.sha }}
          path: apps/mobile/dist/indyz-pos-${{ env.APP_VERSION }}.aab
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days || 14 }}

      # ─────────────────────────────────────────────────────────────────────────
      # Google Play Store Auto-Publish
      #
      # Publishes the signed .aab to Google Play Console.
      # Requires repository secret:
      #   PLAY_STORE_SERVICE_ACCOUNT_JSON (or GOOGLE_PLAY_SERVICE_ACCOUNT_JSON)
      #   containing the Google Cloud Service Account JSON key (plain or base64)
      # ─────────────────────────────────────────────────────────────────────────
      - name: Determine Google Play track and publish intent
        id: play-target
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            TRACK="${{ inputs.play_track || 'internal' }}"
            PUBLISH="${{ inputs.publish_to_play != false }}"
          elif [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            TRACK="production"
            PUBLISH="true"
          else
            # Push on main / master branch publishes to internal testing track
            TRACK="internal"
            PUBLISH="true"
          fi
          echo "track=$TRACK" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          echo "Target track: $TRACK, Should publish: $PUBLISH"

      - name: Prepare Google Play credentials and changelog
        if: env.HAS_PLAY_STORE_KEY == 'true' && steps.play-target.outputs.publish == 'true'
        env:
          SERVICE_ACCOUNT_KEY: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON || secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          mkdir -p distribution/whatsnew
          echo "Release ${APP_VERSION} (${GITHUB_SHA:0:7})" > distribution/whatsnew/whatsnew-en-US

          # Decode key if base64, otherwise write directly
          if echo "$SERVICE_ACCOUNT_KEY" | grep -q '^{'; then
            echo "$SERVICE_ACCOUNT_KEY" > /tmp/google-play-service-account.json
          else
            echo "$SERVICE_ACCOUNT_KEY" | base64 --decode > /tmp/google-play-service-account.json
          fi
          chmod 600 /tmp/google-play-service-account.json

      - name: Publish AAB to Google Play Store
        if: env.HAS_PLAY_STORE_KEY == 'true' && steps.play-target.outputs.publish == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: /tmp/google-play-service-account.json
          packageName: com.indyzai.pos.app
          releaseFiles: apps/mobile/dist/indyz-pos-${{ env.APP_VERSION }}.aab
          track: ${{ steps.play-target.outputs.track }}
          status: completed
          whatsNewDirectory: distribution/whatsnew

      - name: Google Play publish skipped notice
        if: env.HAS_PLAY_STORE_KEY != 'true' && steps.play-target.outputs.publish == 'true'
        run: |
          echo "::notice title=Google Play Publish Skipped::Secret PLAY_STORE_SERVICE_ACCOUNT_JSON is not configured in repository secrets."
