name: Admin Mobile CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main, master]
    paths:
      - ".github/workflows/admin-mobile-ci.yml"
      - "apps/admin-mobile/**"
      - "packages/**"
      - "package.json"
      - "bun.lock"
      - ".bun-version"
  push:
    branches: [main, master]
    paths:
      - ".github/workflows/admin-mobile-ci.yml"
      - "apps/admin-mobile/**"
      - "packages/**"
      - "package.json"
      - "bun.lock"
      - ".bun-version"

permissions:
  contents: read

concurrency:
  group: admin-mobile-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  EXPO_NO_TELEMETRY: "1"

jobs:
  validate:
    name: Validate Admin Mobile App
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        working-directory: apps/admin-mobile
        run: bun run format:check

      - name: TypeScript check
        working-directory: apps/admin-mobile
        run: bunx tsc --noEmit

      - name: Run tests
        working-directory: apps/admin-mobile
        run: bun test tests

      - name: Verify Expo web bundle
        working-directory: apps/admin-mobile
        run: bunx expo export --platform web --output-dir dist-web
