name: iOS Simulator Build

on:
  workflow_dispatch:
    inputs:
      retention_days:
        description: Artifact retention in days
        required: true
        default: "14"
        type: string
  pull_request:
    branches: [main, master]
    paths:
      - ".github/workflows/ios-simulator-build.yml"
      - "apps/mobile/**"
      - "package.json"
      - "bun.lock"
      - ".bun-version"
  push:
    branches: [main, master]
    paths:
      - ".github/workflows/ios-simulator-build.yml"
      - "apps/mobile/**"
      - "package.json"
      - "bun.lock"
      - ".bun-version"

permissions:
  contents: read

env:
  EXPO_NO_TELEMETRY: "1"
  NODE_OPTIONS: --max-old-space-size=6144
  IOS_DERIVED_DATA: /tmp/indyz-pos-derived-data
  IOS_APP_ZIP: /tmp/indyz-pos-simulator.zip

concurrency:
  group: ios-simulator-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-simulator:
    name: iOS Simulator Build
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate iOS project
        working-directory: apps/mobile
        run: bunx expo prebuild --clean --platform ios --non-interactive --no-install

      - name: Install CocoaPods dependencies
        working-directory: apps/mobile/ios
        run: pod install

      - name: Build iOS Simulator app
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          workspace="$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)"
          if [ -z "$workspace" ]; then
            echo "::error::Expo prebuild did not create an iOS workspace."
            exit 1
          fi
          echo "Using workspace: $workspace"

          xcodebuild -list -json -workspace "$workspace" > /tmp/ios-workspace.json
          cat /tmp/ios-workspace.json

          scheme="$(ruby -rjson -e '
            schemes = JSON.parse(STDIN.read).dig("workspace", "schemes") || []
            puts(schemes.find { |s| !s.start_with?("Pods-") })
          ' < /tmp/ios-workspace.json)"

          if [ -z "$scheme" ]; then
            echo "::error::Could not find an application scheme in $workspace."
            exit 1
          fi
          echo "Using scheme: $scheme"

          xcodebuild \
            -workspace "$workspace" \
            -scheme "$scheme" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$IOS_DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package .app as zip
        run: |
          set -euo pipefail
          app="$(find "$IOS_DERIVED_DATA/Build/Products" -maxdepth 2 -name '*.app' -type d -print -quit)"
          if [ -z "$app" ]; then
            echo "::error::No .app bundle found. Build output:"
            find "$IOS_DERIVED_DATA" -type d | head -40 || true
            exit 1
          fi
          echo "Packaging: $app"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$IOS_APP_ZIP"
          echo "Archive size: $(du -sh "$IOS_APP_ZIP" | cut -f1)"

      - name: Upload iOS Simulator app
        uses: actions/upload-artifact@v4
        with:
          name: indyz-pos-ios-simulator-${{ github.sha }}
          path: /tmp/indyz-pos-simulator.zip
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days || 14 }}
