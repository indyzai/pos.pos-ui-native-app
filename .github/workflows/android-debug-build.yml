name: Android Debug APK + AAB

on:
  workflow_dispatch:
    inputs:
      archs:
        description: Comma-separated Android ABIs to build
        required: true
        default: arm64-v8a,armeabi-v7a
        type: string
      retention_days:
        description: Artifact retention in days
        required: true
        default: "14"
        type: string
  pull_request:
    branches: [main, master]
    paths:
      - ".github/workflows/android-debug-build.yml"
      - "apps/mobile/**"
      - "package.json"
      - "bun.lock"
      - ".bun-version"
  push:
    branches: [main, master]
    paths:
      - ".github/workflows/android-debug-build.yml"
      - "apps/mobile/**"
      - "package.json"
      - "bun.lock"
      - ".bun-version"

permissions:
  contents: read

env:
  EXPO_NO_TELEMETRY: "1"
  NODE_OPTIONS: --max-old-space-size=6144
  # Set to non-empty by the signing step when the keystore secret is present.
  SIGNING_FLAGS: ""

concurrency:
  group: android-debug-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-debug:
    name: Android Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('apps/mobile/android/**/*.gradle*', 'apps/mobile/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Android project
        working-directory: apps/mobile
        run: bunx expo prebuild --clean --platform android --non-interactive --no-install

      - name: Prepare Android signing
        # Signing is optional — skipped on forks or when secrets are absent.
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_BASE64:  ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS:         ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD:      ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          KEYSTORE_PATH="$GITHUB_WORKSPACE/apps/mobile/android/app/upload-keystore.jks"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          # Write keystore.properties so Gradle can pick it up via signingConfigs.
          cat > "$GITHUB_WORKSPACE/apps/mobile/android/app/keystore.properties" <<EOF
          storeFile=upload-keystore.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
          # Also export as Gradle -P flags for the build step.
          echo "SIGNING_FLAGS=-Pandroid.injected.signing.store.file=$KEYSTORE_PATH -Pandroid.injected.signing.store.password=$ANDROID_KEYSTORE_PASSWORD -Pandroid.injected.signing.key.alias=$ANDROID_KEY_ALIAS -Pandroid.injected.signing.key.password=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build debug APK and AAB
        working-directory: apps/mobile/android
        env:
          ARCHS: ${{ inputs.archs || 'arm64-v8a,armeabi-v7a' }}
        run: |
          ./gradlew app:assembleDebug app:bundleDebug \
            --no-daemon \
            --no-configuration-cache \
            -PreactNativeArchitectures="$ARCHS" \
            $SIGNING_FLAGS

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: indyz-pos-android-debug-apk-${{ github.sha }}
          path: apps/mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days || 14 }}

      - name: Upload Android debug AAB
        uses: actions/upload-artifact@v4
        with:
          name: indyz-pos-android-debug-aab-${{ github.sha }}
          path: apps/mobile/android/app/build/outputs/bundle/debug/*.aab
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days || 14 }}
