name: Android Debug APK

on:
  workflow_dispatch:
    inputs:
      archs:
        description: Comma-separated Android ABIs to build
        required: true
        default: arm64-v8a,armeabi-v7a
        type: string
      retention_days:
        description: Artifact retention in days
        required: true
        default: "14"
        type: string
  pull_request:
    branches: [main, master]
    paths:
      - ".github/workflows/android-debug-build.yml"
      - "apps/mobile/**"
      - "package.json"
      - "bun.lock"
      - ".bun-version"
  push:
    branches: [main, master]
    paths:
      - ".github/workflows/android-debug-build.yml"
      - "apps/mobile/**"
      - "package.json"
      - "bun.lock"
      - ".bun-version"

permissions:
  contents: read

env:
  EXPO_NO_TELEMETRY: "1"
  NODE_OPTIONS: --max-old-space-size=6144

concurrency:
  group: android-debug-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-debug:
    name: Android Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('apps/mobile/android/**/*.gradle*', 'apps/mobile/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Android project
        working-directory: apps/mobile
        run: bunx expo prebuild --clean --platform android --non-interactive --no-install

      - name: Build debug APK
        working-directory: apps/mobile/android
        env:
          ARCHS: ${{ inputs.archs || 'arm64-v8a,armeabi-v7a' }}
        run: |
          ./gradlew app:assembleDebug \
            --no-daemon \
            --no-configuration-cache \
            -PreactNativeArchitectures="$ARCHS"

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: indyz-pos-android-debug-${{ github.sha }}
          path: apps/mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days || 14 }}
