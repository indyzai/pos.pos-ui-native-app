name: Android Debug APK

on:
  workflow_dispatch:
    inputs:
      archs:
        description: Comma-separated Android ABIs to build
        required: true
        default: arm64-v8a,armeabi-v7a
        type: string
      retention_days:
        description: Artifact retention in days
        required: true
        default: "14"
        type: string
  pull_request:
    branches: [main, master]
    paths:
      - ".github/workflows/android-debug-build.yml"
      - "apps/mobile/**"
      - "package.json"
      - "bun.lock"
      - ".bun-version"
  push:
    branches: [main, master]
    paths:
      - ".github/workflows/android-debug-build.yml"
      - "apps/mobile/**"
      - "package.json"
      - "bun.lock"
      - ".bun-version"

permissions:
  contents: read

env:
  EXPO_NO_TELEMETRY: "1"
  NODE_OPTIONS: --max-old-space-size=6144

concurrency:
  group: android-debug-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-debug:
    name: Android Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Cache Bun dependencies
        uses: actions/cache@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Android project
        working-directory: apps/mobile
        run: bunx expo prebuild --clean --platform android --non-interactive --no-install

      - name: Build debug APK
        working-directory: apps/mobile/android
        env:
          ARCHS: ${{ inputs.archs || 'arm64-v8a,armeabi-v7a' }}
        run: ./gradlew app:assembleDebug --no-daemon -PreactNativeArchitectures="$ARCHS"

      - name: Upload Android debug APK
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: indyz-pos-android-debug-${{ github.sha }}
          path: apps/mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days || 14 }}
